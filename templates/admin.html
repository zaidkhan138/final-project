<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusBus - Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <span>CampusBus Admin</span>
    <button id="logoutBtn" type="button">Logout</button>
  </header>

  <nav>
    <a href="/admin">Admin Dashboard</a>
  </nav>

  <main class="container">
    <h1>Administrator Dashboard</h1>
    <section class="stats">
      <div class="stat"><span id="busCount">0</span><small>Buses</small></div>
      <div class="stat"><span id="tripCount">0</span><small>Active trips</small></div>
      <div class="stat"><span id="requestCount">0</span><small>Pending requests</small></div>
    </section>

    <h2>Add Bus</h2>
    <form id="busForm" class="simple-form">
      <input id="busNumber" placeholder="Bus number" required>
      <input id="busName" placeholder="Bus name" required>
      <input id="busCapacity" type="number" placeholder="Capacity" required>
      <button type="submit">Add Bus</button>
    </form>

    <h2>Add Route</h2>
    <form id="routeForm" class="simple-form">
      <input id="source" placeholder="Source" required>
      <input id="destination" placeholder="Destination" required>
      <input id="routeDescription" placeholder="Description">
      <button type="submit">Add Route</button>
    </form>

    <h2>Buses</h2>
    <div id="busList" class="card-list"></div>

    <h2>Extra Bus Requests</h2>
    <p id="status"></p>
    <div id="requestList" class="card-list"></div>
  </main>

  <script src="/static/auth.js"></script>
</body>
</html>
